<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Titanes Manager</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');
:root{
  --bg:#0B0F14; --surface:#141A21; --surface-2:#1B232C; --border:#26313C;
  --text:#F5F7FA; --text-dim:#8A94A3; --green:#2FBE7A; --green-dim:#1E8C5A;
  --gold:#F2B705; --red:#E5484D; --radius:12px;
  --display:'Oswald',sans-serif; --body:'Inter',sans-serif; --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased;}
.app{max-width:1100px;margin:0 auto;padding:0 20px 60px;}
header.top{padding:28px 0 18px;border-bottom:1px solid var(--border);margin-bottom:22px;display:flex;flex-direction:column;gap:16px;}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.brand-left{display:flex;align-items:center;gap:10px;}
.crest{width:38px;height:38px;border-radius:8px;background:linear-gradient(145deg,var(--green),var(--green-dim));display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;color:#04140C;font-size:16px;box-shadow:0 0 0 2px rgba(47,190,122,.25);object-fit:cover;overflow:hidden;}
.crest img{width:100%;height:100%;object-fit:cover;}
.brand h1{font-family:var(--display);font-weight:700;letter-spacing:0.5px;font-size:22px;margin:0;}
.brand span{color:var(--text-dim);font-size:12px;text-transform:uppercase;letter-spacing:1.5px;}
.header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.conn-status{font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:999px;display:flex;align-items:center;gap:6px;}
.conn-status.ok{background:rgba(47,190,122,.12);color:var(--green);border:1px solid rgba(47,190,122,.3);}
.conn-status.bad{background:rgba(229,72,77,.12);color:var(--red);border:1px solid rgba(229,72,77,.3);}
.conn-status.loading{background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border);}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
.link-btn{font-size:12px;color:var(--text-dim);text-decoration:none;border:1px solid var(--border);padding:5px 12px;border-radius:999px;}
.link-btn:hover{color:var(--text);border-color:#3A4753;}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;}
nav.tabs button{background:transparent;border:1px solid var(--border);color:var(--text-dim);padding:8px 14px;border-radius:999px;font-family:var(--body);font-weight:600;font-size:13px;cursor:pointer;transition:.15s;}
nav.tabs button:hover{color:var(--text);border-color:#3A4753;}
nav.tabs button.active{background:var(--green);color:#04140C;border-color:var(--green);}
h2.section-title{font-family:var(--display);font-size:20px;letter-spacing:.3px;margin:0 0 4px;}
p.section-sub{color:var(--text-dim);margin:0 0 20px;font-size:13.5px;}
.grid{display:grid;gap:14px;}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:800px){.grid.cols-4{grid-template-columns:1fr 1fr;}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
.stat-card .num{font-family:var(--mono);font-size:30px;font-weight:700;color:var(--gold);}
.stat-card .label{color:var(--text-dim);font-size:12.5px;margin-top:4px;}
form.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:24px;}
form.panel.editing{border-color:var(--green);}
form.panel .row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;align-items:flex-end;}
form.panel .field{flex:1;min-width:150px;display:flex;flex-direction:column;gap:6px;}
form.panel label{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-dim);font-weight:600;}
form.panel input, form.panel select{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:9px 10px;font-family:var(--body);font-size:14px;}
form.panel input[type=file]{padding:6px;font-size:12.5px;}
form.panel input[type=checkbox]{width:auto;accent-color:var(--green);}
form.panel input:focus, form.panel select:focus{outline:none;border-color:var(--green);}
.checkbox-field{flex-direction:row;align-items:center;gap:8px;}
button.btn{background:var(--green);color:#04140C;border:none;border-radius:8px;padding:10px 18px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:var(--body);}
button.btn:disabled{opacity:.5;cursor:not-allowed;}
button.btn:hover:not(:disabled){background:#3FD98E;}
button.btn.secondary{background:transparent;border:1px solid var(--border);color:var(--text-dim);}
button.btn.small{padding:6px 12px;font-size:12px;}
button.btn.danger{background:transparent;border:1px solid var(--red);color:var(--red);}
button.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
.list-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:12px;flex-wrap:wrap;}
.list-item .meta{color:var(--text-dim);font-size:12.5px;margin-top:2px;}
.list-item .name{font-weight:700;font-size:15px;}
.item-actions{display:flex;gap:8px;}
.badge{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);font-family:var(--mono);font-weight:700;font-size:12px;color:var(--gold);flex-shrink:0;overflow:hidden;}
.badge img{width:100%;height:100%;object-fit:cover;}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border);}
.pill.susp{background:rgba(229,72,77,.15);color:var(--red);border:1px solid rgba(229,72,77,.35);}
.current-img{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-dim);margin-bottom:6px;}
.current-img img{width:28px;height:28px;border-radius:6px;object-fit:cover;border:1px solid var(--border);}
.empty{text-align:center;padding:50px 20px;color:var(--text-dim);border:1px dashed var(--border);border-radius:var(--radius);}
.empty b{color:var(--text);display:block;margin-bottom:6px;font-size:15px;}
table.stand{width:100%;border-collapse:collapse;font-size:13.5px;}
table.stand th{text-align:left;color:var(--text-dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:8px 10px;border-bottom:1px solid var(--border);}
table.stand td{padding:10px;border-bottom:1px solid var(--border);font-family:var(--mono);}
table.stand td.team{font-family:var(--body);font-weight:600;display:flex;align-items:center;gap:8px;}
table.stand tr:nth-child(1) td.team::before{content:"🏆 ";}
table.stand tr:hover{background:var(--surface-2);}
.match-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;}
.match-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
.match-teams{display:flex;align-items:center;gap:14px;font-family:var(--display);font-size:17px;font-weight:600;}
.score{font-family:var(--mono);font-weight:700;color:var(--gold);font-size:19px;letter-spacing:2px;}
.match-date{color:var(--text-dim);font-size:12px;}
.scorers{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:12.5px;color:var(--text-dim);display:flex;gap:8px;flex-wrap:wrap;}
.scorer-chip{background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px 10px;}
.card-chip{border-radius:999px;padding:3px 10px;font-size:12px;}
.card-chip.amarilla{background:#3a2f05;color:var(--gold);border:1px solid #5a4a0a;}
.card-chip.roja{background:#3a1113;color:var(--red);border:1px solid #5a1a1d;}
.goleador-row{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;}
.goleador-row .rank{font-family:var(--mono);color:var(--text-dim);width:24px;}
.goleador-row .num{margin-left:auto;font-family:var(--mono);font-weight:700;color:var(--gold);font-size:18px;}
.draft-list{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
.draft-chip{background:var(--surface-2);border:1px solid var(--green);color:var(--green);padding:4px 10px;border-radius:999px;font-size:12px;display:flex;gap:6px;align-items:center;}
.draft-chip.roja{border-color:var(--red);color:var(--red);}
.draft-chip button{background:none;border:none;color:var(--red);cursor:pointer;font-weight:700;}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="brand-left">
        <div class="crest" id="app-crest">T</div>
        <div>
          <h1>Titanes Manager</h1>
          <span>Gestión de torneos de fútbol</span>
        </div>
      </div>
      <div class="header-actions">
        <a class="link-btn" href="publico.html" target="_blank">Ver vista pública ↗</a>
        <div class="conn-status loading" id="conn-status"><span class="dot"></span> Conectando…</div>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="content"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://gsyheqfubomeyqqhzqhw.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdzeWhlcWZ1Ym9tZXlxcWh6cWh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNjcxNDcsImV4cCI6MjA5OTc0MzE0N30.QHH5mKlkGKWFjz59aPOiE-rlqfApvD1-3tL6SBLtGHg';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let DATA = { torneos:[], equipos:[], jugadores:[], partidos:[], tarjetas:[] };
let currentTab = 'dashboard';
let draftGoleadores = [], draftTarjetas = [];
let editDraftGoleadores = [], editDraftTarjetas = [];
let uiTablaTorneo = null, uiGoleadoresTorneo = null;
let editingTorneoId = null, editingEquipoId = null, editingJugadorId = null, editingPartidoId = null;

const TABS = [
  {id:'dashboard', label:'Inicio'}, {id:'torneos', label:'Torneos'}, {id:'equipos', label:'Equipos'},
  {id:'jugadores', label:'Jugadores'}, {id:'partidos', label:'Partidos'}, {id:'tabla', label:'Tabla'}, {id:'goleadores', label:'Goleadores'},
];

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function setConnStatus(state, msg){
  const el = document.getElementById('conn-status');
  el.className = 'conn-status ' + state;
  el.innerHTML = `<span class="dot"></span> ${esc(msg)}`;
}

const rowToTorneo = r => ({id:r.id, nombre:r.nombre, categoria:r.categoria, temporada:r.temporada, logoUrl:r.logo_url});
const rowToEquipo = r => ({id:r.id, torneoId:r.torneo_id, nombre:r.nombre, color:r.color, escudoUrl:r.escudo_url});
const rowToJugador = r => ({id:r.id, equipoId:r.equipo_id, nombre:r.nombre, posicion:r.posicion, numero:r.numero, fotoUrl:r.foto_url, tarjetasResetAt:r.tarjetas_reset_at});
const rowToPartido = r => ({id:r.id, torneoId:r.torneo_id, equipoLocalId:r.equipo_local_id, equipoVisitanteId:r.equipo_visitante_id, golesLocal:r.goles_local, golesVisitante:r.goles_visitante, fecha:r.fecha, goleadores:r.goleadores||[], jugado:r.jugado});
const rowToTarjeta = r => ({id:r.id, jugadorId:r.jugador_id, equipoId:r.equipo_id, partidoId:r.partido_id, torneoId:r.torneo_id, tipo:r.tipo, createdAt:r.created_at});

async function uploadImage(file, folder){
  if(!file) return null;
  try{
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const {error} = await sb.storage.from('media').upload(path, file);
    if(error){ alert('Error subiendo imagen: ' + error.message); return null; }
    const {data} = sb.storage.from('media').getPublicUrl(path);
    return data.publicUrl;
  }catch(err){ alert('Error subiendo imagen: ' + err.message); return null; }
}

async function loadData(){
  try{
    const [t,e,j,p,c] = await Promise.all([
      sb.from('torneos').select('*').order('created_at'),
      sb.from('equipos').select('*').order('created_at'),
      sb.from('jugadores').select('*').order('created_at'),
      sb.from('partidos').select('*').order('fecha', {ascending:false}),
      sb.from('tarjetas').select('*'),
    ]);
    if(t.error||e.error||j.error||p.error||c.error) throw (t.error||e.error||j.error||p.error||c.error);
    DATA.torneos = (t.data||[]).map(rowToTorneo);
    DATA.equipos = (e.data||[]).map(rowToEquipo);
    DATA.jugadores = (j.data||[]).map(rowToJugador);
    DATA.partidos = (p.data||[]).map(rowToPartido);
    DATA.tarjetas = (c.data||[]).map(rowToTarjeta);
    setConnStatus('ok', 'Conectado a Supabase');
    const crestEl = document.getElementById('app-crest');
    if(DATA.torneos[0] && DATA.torneos[0].logoUrl){ crestEl.innerHTML = `<img src="${esc(DATA.torneos[0].logoUrl)}">`; }
  }catch(err){ console.error(err); setConnStatus('bad', 'Sin conexión a la base de datos'); }
  render();
}

function switchTab(tab){ currentTab = tab; draftGoleadores=[]; draftTarjetas=[]; editingTorneoId=editingEquipoId=editingJugadorId=editingPartidoId=null; render(); }
function renderNav(){
  document.getElementById('tabs').innerHTML = TABS.map(t => `<button class="${t.id===currentTab?'active':''}" onclick="switchTab('${t.id}')">${t.label}</button>`).join('');
}
function teamName(id){ const e = DATA.equipos.find(x=>x.id===id); return e ? e.nombre : '—'; }
function teamById(id){ return DATA.equipos.find(x=>x.id===id); }
function torneoName(id){ const t = DATA.torneos.find(x=>x.id===id); return t ? t.nombre : '—'; }
function equiposDeTorneo(torneoId){ return DATA.equipos.filter(e=>e.torneoId===torneoId); }
function jugadoresDeEquipo(equipoId){ return DATA.jugadores.filter(j=>j.equipoId===equipoId); }
function teamBadge(equipoId){
  const e = teamById(equipoId);
  if(e && e.escudoUrl) return `<div class="badge"><img src="${esc(e.escudoUrl)}"></div>`;
  return `<div class="badge" style="background:${esc(e?.color||'#1B232C')};color:#04140C;">${esc((e?.nombre||'?').slice(0,1))}</div>`;
}
function jugadorSanciones(j){
  const resetAt = new Date(j.tarjetasResetAt || 0);
  const cards = DATA.tarjetas.filter(t=> t.jugadorId===j.id && new Date(t.createdAt) > resetAt);
  const amarillas = cards.filter(c=>c.tipo==='amarilla').length;
  const rojas = cards.filter(c=>c.tipo==='roja').length;
  return {amarillas, rojas, suspendido: amarillas>=2 || rojas>=1};
}

/* ---------- DASHBOARD ---------- */
function renderDashboard(){
  const ultimos = [...DATA.partidos].filter(p=>p.jugado!==false).sort((a,b)=> new Date(b.fecha)-new Date(a.fecha)).slice(0,4);
  return `
    <h2 class="section-title">Resumen general</h2>
    <p class="section-sub">Así va tu operación de torneos ahora mismo.</p>
    <div class="grid cols-4" style="margin-bottom:26px;">
      <div class="card stat-card"><div class="num">${DATA.torneos.length}</div><div class="label">Torneos</div></div>
      <div class="card stat-card"><div class="num">${DATA.equipos.length}</div><div class="label">Equipos</div></div>
      <div class="card stat-card"><div class="num">${DATA.jugadores.length}</div><div class="label">Jugadores</div></div>
      <div class="card stat-card"><div class="num">${DATA.partidos.length}</div><div class="label">Partidos jugados</div></div>
    </div>
    <h2 class="section-title">Últimos resultados</h2>
    <p class="section-sub">Los partidos más recientes que registraste.</p>
    ${ultimos.length ? ultimos.map(renderMatchCard).join('') : `<div class="empty"><b>Todavía no hay partidos registrados</b>Ve a la pestaña "Partidos" para cargar el primer resultado.</div>`}
  `;
}

/* ---------- TORNEOS ---------- */
function renderTorneos(){
  return `
    <h2 class="section-title">Torneos</h2>
    <p class="section-sub">Crea y administra los torneos que estás organizando.</p>
    <form class="panel" onsubmit="addTorneo(event)">
      <div class="row">
        <div class="field"><label>Nombre del torneo</label><input name="nombre" placeholder="Torneo Inactivo de Titanes IV" required></div>
        <div class="field"><label>Categoría</label><select name="categoria"><option>Masculino</option><option>Femenino</option><option>Juvenil</option><option>Veteranos</option><option>Mixto</option></select></div>
        <div class="field"><label>Temporada</label><input name="temporada" placeholder="2026" required></div>
      </div>
      <div class="row"><div class="field"><label>Logo del torneo (opcional)</label><input type="file" name="logo" accept="image/*"></div></div>
      <button class="btn" type="submit">Crear torneo</button>
    </form>
    ${DATA.torneos.length ? DATA.torneos.map(t => t.id===editingTorneoId ? renderTorneoEditForm(t) : `
      <div class="list-item">
        <div style="display:flex;align-items:center;gap:12px;">
          <div class="badge">${t.logoUrl ? `<img src="${esc(t.logoUrl)}">` : esc((t.nombre||'?').slice(0,1))}</div>
          <div>
            <div class="name">${esc(t.nombre)}</div>
            <div class="meta">${esc(t.categoria)} · Temporada ${esc(t.temporada)} · ${equiposDeTorneo(t.id).length} equipos</div>
          </div>
        </div>
        <div class="item-actions">
          <button class="btn ghost small" onclick="editingTorneoId='${t.id}';render()">Editar</button>
          <button class="btn danger small" onclick="deleteTorneo('${t.id}')">Eliminar</button>
        </div>
      </div>`).join('') : `<div class="empty"><b>Aún no has creado ningún torneo</b>Usa el formulario de arriba para crear el primero.</div>`}
  `;
}
function renderTorneoEditForm(t){
  return `
    <form class="panel editing" onsubmit="saveTorneoEdit(event,'${t.id}')" data-current-logo="${esc(t.logoUrl||'')}">
      <div class="row">
        <div class="field"><label>Nombre del torneo</label><input name="nombre" value="${esc(t.nombre)}" required></div>
        <div class="field"><label>Categoría</label><select name="categoria">${['Masculino','Femenino','Juvenil','Veteranos','Mixto'].map(c=>`<option ${c===t.categoria?'selected':''}>${c}</option>`).join('')}</select></div>
        <div class="field"><label>Temporada</label><input name="temporada" value="${esc(t.temporada)}" required></div>
      </div>
      <div class="row">
        <div class="field">
          <label>Logo del torneo</label>
          ${t.logoUrl ? `<div class="current-img"><img src="${esc(t.logoUrl)}"> Imagen actual</div>` : ''}
          <input type="file" name="logo" accept="image/*">
        </div>
      </div>
      <div class="row">
        <button class="btn" type="submit">Guardar cambios</button>
        <button class="btn secondary" type="button" onclick="editingTorneoId=null;render()">Cancelar</button>
      </div>
    </form>`;
}
async function addTorneo(ev){
  ev.preventDefault();
  const f = ev.target;
  const btn = f.querySelector('button'); btn.disabled = true; btn.textContent='Guardando...';
  const logo_url = await uploadImage(f.logo.files[0], 'torneos');
  const {error} = await sb.from('torneos').insert({ nombre: f.nombre.value.trim(), categoria: f.categoria.value, temporada: f.temporada.value.trim(), logo_url });
  if(error){ alert('Error al crear el torneo: ' + error.message); btn.disabled=false; btn.textContent='Crear torneo'; return; }
  f.reset();
  await loadData();
}
async function saveTorneoEdit(ev, id){
  ev.preventDefault();
  const f = ev.target;
  const btn = f.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent='Guardando...';
  let logo_url = f.dataset.currentLogo || null;
  if(f.logo.files[0]){ const url = await uploadImage(f.logo.files[0], 'torneos'); if(url) logo_url = url; }
  const {error} = await sb.from('torneos').update({ nombre: f.nombre.value.trim(), categoria: f.categoria.value, temporada: f.temporada.value.trim(), logo_url }).eq('id', id);
  if(error){ alert('Error: ' + error.message); btn.disabled=false; return; }
  editingTorneoId = null;
  await loadData();
}
async function deleteTorneo(id){
  if(!confirm('¿Eliminar este torneo? Se borrarán también sus equipos, jugadores y partidos.')) return;
  const {error} = await sb.from('torneos').delete().eq('id', id);
  if(error){ alert('Error al eliminar: ' + error.message); return; }
  await loadData();
}

/* ---------- EQUIPOS ---------- */
function renderEquipos(){
  const torneoOptions = DATA.torneos.map(t=>`<option value="${t.id}">${esc(t.nombre)}</option>`).join('');
  return `
    <h2 class="section-title">Equipos</h2>
    <p class="section-sub">Registra los equipos inscritos en cada torneo.</p>
    ${DATA.torneos.length===0 ? `<div class="empty"><b>Primero crea un torneo</b>Los equipos necesitan estar asociados a un torneo.</div>` : `
    <form class="panel" onsubmit="addEquipo(event)">
      <div class="row">
        <div class="field"><label>Nombre del equipo</label><input name="nombre" placeholder="Atlético Maicao" required></div>

  const {data, error} = await sb.from('partidos').insert({
    torneo_id: f.torneoId.value, equipo_local_id: f.equipoLocalId.value, equipo_visitante_id: f.equipoVisitanteId.value,
    goles_local: parseInt(f.golesLocal.value||0), goles_visitante: parseInt(f.golesVisitante.value||0),
    fecha: f.fecha.value, goleadores: draftGoleadores, jugado
  }).select().single();
  if(error){ alert('Error al guardar el partido: ' + error.message); btn.disabled=false; btn.textContent='Guardar partido'; return; }
  if(draftTarjetas.length){
    const rows = draftTarjetas.map(t=>({jugador_id:t.jugadorId, equipo_id:t.equipoId, partido_id:data.id, torneo_id:f.torneoId.value, tipo:t.tipo}));
    const {error:err2} = await sb.from('tarjetas').insert(rows);
    if(err2) alert('El partido se guardó, pero hubo un error con las tarjetas: ' + err2.message);
  }
  draftGoleadores=[]; draftTarjetas=[];
  await loadData();
}
async function savePartidoEdit(ev, id){
  ev.preventDefault();
  const f = ev.target;
  if(f.equipoLocalId.value === f.equipoVisitanteId.value){ alert('El equipo local y visitante deben ser diferentes.'); return; }
  const btn = f.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent='Guardando...';
  const {error} = await sb.from('partidos').update({
    equipo_local_id: f.equipoLocalId.value, equipo_visitante_id: f.equipoVisitanteId.value,
    goles_local: parseInt(f.golesLocal.value||0), goles_visitante: parseInt(f.golesVisitante.value||0),
    fecha: f.fecha.value, jugado: f.jugado.checked, goleadores: editDraftGoleadores
  }).eq('id', id);
  if(error){ alert('Error: ' + error.message); btn.disabled=false; return; }
  if(editDraftTarjetas.length){
    const rows = editDraftTarjetas.map(t=>({jugador_id:t.jugadorId, equipo_id:t.equipoId, partido_id:id, torneo_id:f.dataset.torneo, tipo:t.tipo}));
    const {error:err2} = await sb.from('tarjetas').insert(rows);
    if(err2) alert('Cambios guardados, pero hubo un error con las tarjetas nuevas: ' + err2.message);
  }
  editingPartidoId = null; editDraftGoleadores=[]; editDraftTarjetas=[];
  await loadData();
}
async function deletePartido(id){
  if(!confirm('¿Eliminar este partido? También se eliminarán sus tarjetas registradas.')) return;
  const {error} = await sb.from('partidos').delete().eq('id', id);
  if(error){ alert('Error al eliminar: ' + error.message); return; }
  await loadData();
}

/* ---------- TABLA ---------- */
function computeStandings(torneoId){
  const equipos = equiposDeTorneo(torneoId);
  const stats = {};
  equipos.forEach(e=> stats[e.id] = {id:e.id, nombre:e.nombre, pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0});
  DATA.partidos.filter(p=>p.torneoId===torneoId && p.jugado!==false).forEach(p=>{
    const L = stats[p.equipoLocalId], V = stats[p.equipoVisitanteId];
    if(!L || !V) return;
    L.pj++; V.pj++; L.gf+=p.golesLocal; L.gc+=p.golesVisitante; V.gf+=p.golesVisitante; V.gc+=p.golesLocal;
    if(p.golesLocal > p.golesVisitante){ L.g++; L.pts+=3; V.p++; }
    else if(p.golesLocal < p.golesVisitante){ V.g++; V.pts+=3; L.p++; }
    else { L.e++; V.e++; L.pts++; V.pts++; }
  });
  return Object.values(stats).sort((a,b)=> b.pts-a.pts || (b.gf-b.gc)-(a.gf-a.gc) || b.gf-a.gf);
}
function renderTabla(){
  if(!uiTablaTorneo && DATA.torneos.length) uiTablaTorneo = DATA.torneos[0].id;
  const torneoOptions = DATA.torneos.map(t=>`<option value="${t.id}" ${t.id===uiTablaTorneo?'selected':''}>${esc(t.nombre)}</option>`).join('');
  const standings = uiTablaTorneo ? computeStandings(uiTablaTorneo) : [];
  return `
    <h2 class="section-title">Tabla de posiciones</h2>
    <p class="section-sub">Se calcula automáticamente a partir de los partidos ya jugados.</p>
    ${DATA.torneos.length===0 ? `<div class="empty"><b>Sin torneos aún</b></div>` : `
    <div class="row" style="margin-bottom:16px;"><select onchange="uiTablaTorneo=this.value;render()" style="background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:8px;">${torneoOptions}</select></div>
    <div class="card" style="padding:0;overflow-x:auto;">
      <table class="stand">
        <thead><tr><th>Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DG</th><th>Pts</th></tr></thead>
        <tbody>
          ${standings.length ? standings.map(s=>`<tr><td class="team">${teamBadge(s.id)}${esc(s.nombre)}</td><td>${s.pj}</td><td>${s.g}</td><td>${s.e}</td><td>${s.p}</td><td>${s.gf}</td><td>${s.gc}</td><td>${s.gf-s.gc}</td><td>${s.pts}</td></tr>`).join('') : `<tr><td colspan="9" style="text-align:center;color:var(--text-dim);padding:24px;font-family:var(--body);">Este torneo aún no tiene equipos.</td></tr>`}
        </tbody>
      </table>
    </div>`}
  `;
}

/* ---------- GOLEADORES ---------- */
function computeGoleadores(torneoId){
  const counts = {};
  DATA.partidos.filter(p=>p.torneoId===torneoId && p.jugado!==false).forEach(p=>{
    (p.goleadores||[]).forEach(g=>{
      if(!counts[g.jugadorId]) counts[g.jugadorId] = {jugadorId:g.jugadorId, nombre:g.jugadorNombre, equipoId:g.equipoId, goles:0};
      counts[g.jugadorId].goles++;
    });
  });
  return Object.values(counts).sort((a,b)=>b.goles-a.goles);
}
function renderGoleadores(){
  if(!uiGoleadoresTorneo && DATA.torneos.length) uiGoleadoresTorneo = DATA.torneos[0].id;
  const torneoOptions = DATA.torneos.map(t=>`<option value="${t.id}" ${t.id===uiGoleadoresTorneo?'selected':''}>${esc(t.nombre)}</option>`).join('');
  const goleadores = uiGoleadoresTorneo ? computeGoleadores(uiGoleadoresTorneo) : [];
  return `
    <h2 class="section-title">Tabla de goleadores</h2>
    <p class="section-sub">Ranking generado a partir de los goles cargados en cada partido.</p>
    ${DATA.torneos.length===0 ? `<div class="empty"><b>Sin torneos aún</b></div>` : `
    <div class="row" style="margin-bottom:16px;"><select onchange="uiGoleadoresTorneo=this.value;render()" style="background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:8px;">${torneoOptions}</select></div>
    ${goleadores.length ? goleadores.map((g,i)=>{
      const jj = DATA.jugadores.find(x=>x.id===g.jugadorId);
      return `<div class="goleador-row"><span class="rank">${i+1}</span><div class="badge">${jj&&jj.fotoUrl?`<img src="${esc(jj.fotoUrl)}">`:esc(g.nombre.slice(0,1))}</div><div><div class="name">${esc(g.nombre)}</div><div class="meta">${esc(teamName(g.equipoId))}</div></div><span class="num">${g.goles}</span></div>`;
    }).join('') : `<div class="empty"><b>Todavía no hay goles cargados en este torneo</b>Agrega goleadores al registrar un partido.</div>`}
    `}
  `;
}

/* ---------- ROUTER ---------- */
function render(){
  renderNav();
  const routes = { dashboard: renderDashboard, torneos: renderTorneos, equipos: renderEquipos, jugadores: renderJugadores, partidos: renderPartidos, tabla: renderTabla, goleadores: renderGoleadores };
  document.getElementById('content').innerHTML = routes[currentTab]();
  if(currentTab === 'partidos'){
    if(editingPartidoId){ renderEditDraftList(); renderEditDraftTarjetasList(); }
    else { updatePartidoTeamOptions(); renderDraftList(); renderDraftTarjetasList(); }
  }
}

loadData();
</script>
