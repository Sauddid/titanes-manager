<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Titanes Manager · Vista pública</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');
:root{
  --bg:#0B0F14; --surface:#141A21; --surface-2:#1B232C; --border:#26313C;
  --text:#F5F7FA; --text-dim:#8A94A3; --green:#2FBE7A; --green-dim:#1E8C5A;
  --gold:#F2B705; --red:#E5484D; --radius:12px;
  --display:'Oswald',sans-serif; --body:'Inter',sans-serif; --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased;}
.app{max-width:900px;margin:0 auto;padding:0 20px 60px;}
header.top{padding:28px 0 18px;border-bottom:1px solid var(--border);margin-bottom:22px;display:flex;flex-direction:column;gap:16px;}
.brand{display:flex;align-items:center;gap:10px;}
.crest{width:44px;height:44px;border-radius:10px;background:linear-gradient(145deg,var(--green),var(--green-dim));display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;color:#04140C;font-size:18px;overflow:hidden;}
.crest img{width:100%;height:100%;object-fit:cover;}
.brand h1{font-family:var(--display);font-weight:700;letter-spacing:0.5px;font-size:24px;margin:0;}
.brand span{color:var(--text-dim);font-size:12px;text-transform:uppercase;letter-spacing:1.5px;}
select.torneo-select{background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:8px;font-family:var(--body);font-size:14px;}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;}
nav.tabs button{background:transparent;border:1px solid var(--border);color:var(--text-dim);padding:8px 14px;border-radius:999px;font-family:var(--body);font-weight:600;font-size:13px;cursor:pointer;}
nav.tabs button.active{background:var(--green);color:#04140C;border-color:var(--green);}
h2.section-title{font-family:var(--display);font-size:20px;letter-spacing:.3px;margin:0 0 4px;}
p.section-sub{color:var(--text-dim);margin:0 0 20px;font-size:13.5px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
.empty{text-align:center;padding:50px 20px;color:var(--text-dim);border:1px dashed var(--border);border-radius:var(--radius);}
.empty b{color:var(--text);display:block;margin-bottom:6px;font-size:15px;}
table.stand{width:100%;border-collapse:collapse;font-size:13.5px;}
table.stand th{text-align:left;color:var(--text-dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:8px 10px;border-bottom:1px solid var(--border);}
table.stand td{padding:10px;border-bottom:1px solid var(--border);font-family:var(--mono);}
table.stand td.team{font-family:var(--body);font-weight:600;display:flex;align-items:center;gap:8px;}
table.stand tr:nth-child(1) td.team::before{content:"🏆 ";}
.badge{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);font-family:var(--mono);font-weight:700;font-size:12px;color:var(--gold);flex-shrink:0;overflow:hidden;}
.badge img{width:100%;height:100%;object-fit:cover;}
.match-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;}
.match-teams{display:flex;align-items:center;gap:14px;font-family:var(--display);font-size:17px;font-weight:600;}
.score{font-family:var(--mono);font-weight:700;color:var(--gold);font-size:19px;letter-spacing:2px;}
.match-date{color:var(--text-dim);font-size:12px;margin-top:6px;}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border);}
.goleador-row{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;}
.goleador-row .rank{font-family:var(--mono);color:var(--text-dim);width:24px;}
.goleador-row .num{margin-left:auto;font-family:var(--mono);font-weight:700;color:var(--gold);font-size:18px;}
.name{font-weight:700;font-size:15px;}
.meta{color:var(--text-dim);font-size:12.5px;}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="crest" id="app-crest">T</div>
      <div>
        <h1>Titanes Manager</h1>
        <span>Vista pública del torneo</span>
      </div>
    </div>
    <select class="torneo-select" id="torneo-select" onchange="uiTorneo=this.value; render();"></select>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="content"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://gsyheqfubomeyqqhzqhw.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdzeWhlcWZ1Ym9tZXlxcWh6cWh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNjcxNDcsImV4cCI6MjA5OTc0MzE0N30.QHH5mKlkGKWFjz59aPOiE-rlqfApvD1-3tL6SBLtGHg';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let DATA = { torneos:[], equipos:[], jugadores:[], partidos:[] };
let uiTorneo = null;
let currentTab = 'tabla';
const TABS = [ {id:'tabla', label:'Tabla'}, {id:'goleadores', label:'Goleadores'}, {id:'proximos', label:'Próximos partidos'}, {id:'resultados', label:'Resultados'} ];

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const rowToTorneo = r => ({id:r.id, nombre:r.nombre, categoria:r.categoria, temporada:r.temporada, logoUrl:r.logo_url});
const rowToEquipo = r => ({id:r.id, torneoId:r.torneo_id, nombre:r.nombre, color:r.color, escudoUrl:r.escudo_url});
const rowToJugador = r => ({id:r.id, equipoId:r.equipo_id, nombre:r.nombre});
const rowToPartido = r => ({id:r.id, torneoId:r.torneo_id, equipoLocalId:r.equipo_local_id, equipoVisitanteId:r.equipo_visitante_id, golesLocal:r.goles_local, golesVisitante:r.goles_visitante, fecha:r.fecha, goleadores:r.goleadores||[], jugado:r.jugado});

async function loadData(){
  try{
    const [t,e,j,p] = await Promise.all([
      sb.from('torneos').select('*').order('created_at'),
      sb.from('equipos').select('*').order('created_at'),
      sb.from('jugadores').select('*').order('created_at'),
      sb.from('partidos').select('*').order('fecha'),
    ]);
    DATA.torneos = (t.data||[]).map(rowToTorneo);
    DATA.equipos = (e.data||[]).map(rowToEquipo);
    DATA.jugadores = (j.data||[]).map(rowToJugador);
    DATA.partidos = (p.data||[]).map(rowToPartido);
    if(!uiTorneo && DATA.torneos.length) uiTorneo = DATA.torneos[0].id;
    const t0 = DATA.torneos.find(x=>x.id===uiTorneo);
    if(t0 && t0.logoUrl){ document.getElementById('app-crest').innerHTML = `<img src="${esc(t0.logoUrl)}">`; }
  }catch(err){ console.error(err); }
  render();
}

function teamName(id){ const e=DATA.equipos.find(x=>x.id===id); return e?e.nombre:'—'; }
function teamById(id){ return DATA.equipos.find(x=>x.id===id); }
function teamBadge(equipoId){
  const e = teamById(equipoId);
  if(e && e.escudoUrl) return `<div class="badge"><img src="${esc(e.escudoUrl)}"></div>`;
  return `<div class="badge" style="background:${esc(e?.color||'#1B232C')};color:#04140C;">${esc((e?.nombre||'?').slice(0,1))}</div>`;
}
function switchTab(tab){ currentTab=tab; render(); }
function renderNav(){ document.getElementById('tabs').innerHTML = TABS.map(t=>`<button class="${t.id===currentTab?'active':''}" onclick="switchTab('${t.id}')">${t.label}</button>`).join(''); }
function renderTorneoSelect(){ document.getElementById('torneo-select').innerHTML = DATA.torneos.map(t=>`<option value="${t.id}" ${t.id===uiTorneo?'selected':''}>${esc(t.nombre)}</option>`).join('') || '<option>Sin torneos</option>'; }

function computeStandings(torneoId){
  const equipos = DATA.equipos.filter(e=>e.torneoId===torneoId);
  const stats = {};
  equipos.forEach(e=> stats[e.id] = {id:e.id, nombre:e.nombre, pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0});
  DATA.partidos.filter(p=>p.torneoId===torneoId && p.jugado!==false).forEach(p=>{
    const L=stats[p.equipoLocalId], V=stats[p.equipoVisitanteId]; if(!L||!V) return;
    L.pj++; V.pj++; L.gf+=p.golesLocal; L.gc+=p.golesVisitante; V.gf+=p.golesVisitante; V.gc+=p.golesLocal;
    if(p.golesLocal>p.golesVisitante){ L.g++; L.pts+=3; V.p++; }
    else if(p.golesLocal<p.golesVisitante){ V.g++; V.pts+=3; L.p++; }
    else { L.e++; V.e++; L.pts++; V.pts++; }
  });
  return Object.values(stats).sort((a,b)=> b.pts-a.pts || (b.gf-b.gc)-(a.gf-a.gc) || b.gf-a.gf);
}
function renderTabla(){
  if(!uiTorneo) return `<div class="empty"><b>Sin torneos publicados aún</b></div>`;
  const standings = computeStandings(uiTorneo);
  return `<h2 class="section-title">Tabla de posiciones</h2><p class="section-sub">Actualizada en tiempo real.</p>
  <div class="card" style="padding:0;overflow-x:auto;"><table class="stand">
    <thead><tr><th>Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DG</th><th>Pts</th></tr></thead>
    <tbody>${standings.length ? standings.map(s=>`<tr><td class="team">${teamBadge(s.id)}${esc(s.nombre)}</td><td>${s.pj}</td><td>${s.g}</td><td>${s.e}</td><td>${s.p}</td><td>${s.gf}</td><td>${s.gc}</td><td>${s.gf-s.gc}</td><td>${s.pts}</td></tr>`).join('') : `<tr><td colspan="9" style="text-align:center;color:var(--text-dim);padding:24px;">Sin equipos todavía.</td></tr>`}</tbody>
  </table></div>`;
}
function computeGoleadores(torneoId){
  const counts = {};
  DATA.partidos.filter(p=>p.torneoId===torneoId && p.jugado!==false).forEach(p=>{
    (p.goleadores||[]).forEach(g=>{ if(!counts[g.jugadorId]) counts[g.jugadorId]={jugadorId:g.jugadorId, nombre:g.jugadorNombre, equipoId:g.equipoId, goles:0}; counts[g.jugadorId].goles++; });
  });
  return Object.values(counts).sort((a,b)=>b.goles-a.goles);
}
function renderGoleadores(){
  if(!uiTorneo) return `<div class="empty"><b>Sin torneos publicados aún</b></div>`;
  const goleadores = computeGoleadores(uiTorneo);
  return `<h2 class="section-title">Goleadores</h2><p class="section-sub">Ranking del torneo seleccionado.</p>
  ${goleadores.length ? goleadores.map((g,i)=>`<div class="goleador-row"><span class="rank">${i+1}</span>${teamBadge(g.equipoId)}<div><div class="name">${esc(g.nombre)}</div><div class="meta">${esc(teamName(g.equipoId))}</div></div><span class="num">${g.goles}</span></div>`).join('') : `<div class="empty"><b>Aún no hay goles registrados</b></div>`}`;
}
function renderProximos(){
  if(!uiTorneo) return `<div class="empty"><b>Sin torneos publicados aún</b></div>`;
  const proximos = DATA.partidos.filter(p=>p.torneoId===uiTorneo && p.jugado===false).sort((a,b)=> new Date(a.fecha)-new Date(b.fecha));
  return `<h2 class="section-title">Próximos partidos</h2><p class="section-sub">Partidos programados que aún no se han jugado.</p>
  ${proximos.length ? proximos.map(p=>`<div class="match-card"><div class="match-teams">${teamBadge(p.equipoLocalId)}<span>${esc(teamName(p.equipoLocalId))}</span><span class="pill">VS</span><span>${esc(teamName(p.equipoVisitanteId))}</span>${teamBadge(p.equipoVisitanteId)}</div><div class="match-date">${esc(p.fecha)}</div></div>`).join('') : `<div class="empty"><b>No hay partidos programados por ahora</b></div>`}`;
}
function renderResultados(){
  if(!uiTorneo) return `<div class="empty"><b>Sin torneos publicados aún</b></div>`;
  const jugados = DATA.partidos.filter(p=>p.torneoId===uiTorneo && p.jugado!==false).sort((a,b)=> new Date(b.fecha)-new Date(a.fecha));
  return `<h2 class="section-title">Resultados</h2><p class="section-sub">Partidos ya disputados.</p>
  ${jugados.length ? jugados.map(p=>`<div class="match-card"><div class="match-teams">${teamBadge(p.equipoLocalId)}<span>${esc(teamName(p.equipoLocalId))}</span><span class="score">${p.golesLocal} — ${p.golesVisitante}</span><span>${esc(teamName(p.equipoVisitanteId))}</span>${teamBadge(p.equipoVisitanteId)}</div><div class="match-date">${esc(p.fecha)}</div></div>`).join('') : `<div class="empty"><b>Aún no hay resultados</b></div>`}`;
}

function render(){
  renderNav(); renderTorneoSelect();
  const routes = { tabla: renderTabla, goleadores: renderGoleadores, proximos: renderProximos, resultados: renderResultados };
  document.getElementById('content').innerHTML = routes[currentTab]();
}
loadData();
</script>
</body>
</html>
